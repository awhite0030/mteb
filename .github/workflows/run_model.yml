name: Run Model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "The model name to run."
        type: string
        required: true
      revision:
        description: "The revision of the model."
        type: string
        required: false
      tasks:
        description: "The tasks to run the model on. E.g. 'Banking77Classification,ImdbClassification'"
        type: string
        required: true
      pr_number:
        description: "The PR number to report the results to."
        type: string
        required: true

jobs:
  run-model:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR ref
        id: pr_ref
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER),
            });
            core.setOutput('ref', pullRequest.head.ref);
            core.setOutput('repo', pullRequest.head.repo.full_name);

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_ref.outputs.repo }}
          ref: ${{ steps.pr_ref.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run model
        env:
          MODEL: ${{ inputs.model }}
          TASKS: ${{ inputs.tasks }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [ -n "$REVISION" ]; then
            uv run mteb run -m "$MODEL" -t "$TASKS" --model-revision "$REVISION" --output-folder results
          else
            uv run mteb run -m "$MODEL" -t "$TASKS" --output-folder results
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results

      - name: Report to PR
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          TASKS: ${{ inputs.tasks }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const run_url = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;

            let message = `## Model Run Results\n\n`;
            message += `**Model:** \`${process.env.MODEL}\`\n`;
            if (process.env.REVISION) {
              message += `**Revision:** \`${process.env.REVISION}\`\n`;
            }
            message += `**Tasks:** \`${process.env.TASKS}\`\n\n`;
            message += `**Status:** ${process.env.JOB_STATUS === 'success' ? '✅ Success' : '❌ Failed'}\n\n`;
            message += `[View Run Details and Artifacts](${run_url})\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: message
            });
